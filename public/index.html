<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* 기본 바탕 */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>우리 반 과제함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Sans+KR:wght@700;800;900&display=swap">
<style>
/* Layout: 교실 게시판처럼 번호 카드 격자가 주인공. 위에는 과제 칩, 카드를 누르면 오른쪽(모바일은 아래) 시트가 열린다. */
:root{
  --st-pass:#2F78D4; --st-pass-soft:#E3EEFC;
  --tc-0:#3768D6; --tc-1:#E0702A; --tc-2:#23955F; --tc-3:#2E9FD6; --tc-4:#D2457F;
  --st-wait-soft:#FFF5DC; --st-sent-soft:#FDE6E3; --st-done-soft:#E0F3E7;
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#1C2230; --muted:#667085; --line:#DCE1EA;
  --accent:#2C4FA8; --accent-ink:#FFFFFF; --accent-soft:#E6ECFA;
  --st-wait:#FFD27A; --st-wait-ink:#6B4A06;
  --st-sent:#F2685C; --st-sent-ink:#FFFFFF;
  --st-done:#43A96F; --st-done-ink:#FFFFFF;
  --st-none:#E9ECF1; --st-none-ink:#98A2B3;
  --shadow:0 1px 2px rgba(28,34,48,.06),0 8px 24px rgba(28,34,48,.08);
  --f-display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151C; --surface:#1B2029; --ink:#E8ECF3; --muted:#9AA4B5; --line:#2C3340;
  --accent:#8EA8F0; --accent-ink:#0F1420; --accent-soft:#232C44;
  --st-wait:#D9A945; --st-wait-ink:#2A1D02;
  --st-sent:#E0584D; --st-sent-ink:#FFFFFF;
  --st-done:#3C9A64; --st-done-ink:#FFFFFF;
  --st-none:#262C37; --st-none-ink:#6E7888; --st-wait-soft:#3A3018; --st-sent-soft:#3F2220; --st-done-soft:#1D3627; --st-pass:#7FB2F2; --st-pass-soft:#1C2C45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1B2029; --ink:#E8ECF3; --muted:#9AA4B5; --line:#2C3340;
  --accent:#8EA8F0; --accent-ink:#0F1420; --accent-soft:#232C44;
  --st-wait:#D9A945; --st-wait-ink:#2A1D02;
  --st-sent:#E0584D; --st-sent-ink:#FFFFFF;
  --st-done:#3C9A64; --st-done-ink:#FFFFFF;
  --st-none:#262C37; --st-none-ink:#6E7888; --st-wait-soft:#3A3018; --st-sent-soft:#3F2220; --st-done-soft:#1D3627; --st-pass:#7FB2F2; --st-pass-soft:#1C2C45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:18px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:30px;letter-spacing:.5px}
.brand small{color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.linkbtn{background:none;border:none;color:var(--accent);padding:4px 6px;font-size:13px;font-weight:500}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;max-width:100%}
.tab{border:none;background:none;padding:8px 18px;border-radius:9px;font-weight:500;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--st-sent);color:var(--st-sent-ink);font-size:12px;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;text-align:left;display:flex;flex-direction:column;gap:2px;max-width:240px}
.chip b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip.add{border-style:dashed;color:var(--accent);justify-content:center;font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ahead{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-start}
.ahead h2{font-size:20px}
.meta{color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.desc{white-space:pre-wrap;max-width:65ch;margin:4px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{background:var(--st-sent);border-color:var(--st-sent);color:var(--st-sent-ink)}
.btn.ok{background:var(--st-done);border-color:var(--st-done);color:var(--st-done-ink)}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tally{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tally i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tally b{color:var(--ink);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{border:none;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;min-height:72px;position:relative;transition:transform .12s}
.card:hover{transform:translateY(-1px)}
.card .no{font-family:var(--f-display);font-size:30px;line-height:1;min-width:1.4em;font-variant-numeric:tabular-nums;opacity:.75}
.card .nm{font-weight:700;font-size:15px;display:block}
.card .sub{font-size:12px;display:block;opacity:.85}
.card .flag{position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;opacity:.9}
.s-wait{background:var(--st-wait);color:var(--st-wait-ink)}
.s-sent{background:var(--st-sent);color:var(--st-sent-ink)}
.s-done{background:var(--st-done);color:var(--st-done-ink)}
.s-none{background:var(--st-none);color:var(--st-none-ink)}
.card.addcard{background:var(--surface);border:1px dashed var(--line);color:var(--muted);justify-content:center;font-size:26px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h3{color:var(--ink);font-size:17px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.row .dot{width:12px;height:36px;border-radius:6px;flex:none}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:700}
.row .main span{font-size:13px;color:var(--muted)}
.status{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;flex:none}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:var(--st-sent);color:var(--st-sent-ink)}
.notice .t{flex:1;min-width:0}
.notice button{background:rgba(255,255,255,.2);border:none;color:inherit;padding:6px 10px;border-radius:8px;font-size:13px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--surface);width:min(520px,100%);height:100%;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
@media (max-width:640px){.scrim{align-items:flex-end}.sheet{height:auto;max-height:92%;border-radius:18px 18px 0 0}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-h h2{font-size:20px}
.x{border:none;background:var(--bg);width:34px;height:34px;border-radius:10px;font-size:18px;flex:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.inp,textarea.inp,select.inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:15px;width:100%}
textarea.inp{min-height:120px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.frow{grid-template-columns:1fr}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--ink);display:flex;gap:6px;align-items:center;cursor:pointer}
.seg input:checked+span{color:var(--accent);font-weight:700}
.box{background:var(--bg);border-radius:12px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.photo{border-radius:12px;max-width:100%;display:block;border:1px solid var(--line)}
.feedback{border-left:4px solid var(--st-done);padding:10px 14px;background:var(--bg);border-radius:0 12px 12px 0;white-space:pre-wrap}
.stamps{display:flex;gap:6px;flex-wrap:wrap}
.okgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:480px){.okgrid{grid-template-columns:1fr}}
.okbtn{border:none;border-radius:12px;padding:14px 10px;background:var(--st-done);color:var(--st-done-ink);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.okbtn small{font-weight:400;font-size:11px;opacity:.85}
.okbtn[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--ink)}
.stampbig{display:inline-block;font-family:var(--f-display);font-size:22px;padding:8px 16px;border-radius:12px;background:var(--st-done);color:var(--st-done-ink)}
.backbox{border-left:4px solid var(--st-sent);padding:10px 14px;background:var(--bg);border-radius:0 12px 12px 0;white-space:pre-wrap}
.divider{border:none;border-top:1px solid var(--line);margin:4px 0;width:100%}
.stamps button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px}
.confirm{background:var(--bg);border-radius:12px;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.confirm span{flex:1;min-width:160px;font-size:14px}
/* exam */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.3px;background:var(--bg)}
td.num,th.num{font-variant-numeric:tabular-nums;width:56px}
td input{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font-variant-numeric:tabular-nums}
td input:hover,td input:focus{border-color:var(--line);background:var(--bg)}
td input.score{width:80px}
tr:last-child td{border-bottom:none}
.bar{height:8px;background:var(--st-none);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:4px}
.examrow{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.examrow .top2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.score-big{font-family:var(--f-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.score-big small{font-family:var(--f-body);font-size:14px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.req{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px}
.req .line1{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.demo{font-size:12px;color:var(--muted);border:1px dashed var(--line);padding:6px 10px;border-radius:8px}
/* 수행평가: 과목 색, 평가척도 */
:root{
  --sc-0:#E0663F; --sc-1:#2F6FD6; --sc-2:#2E9C8A; --sc-3:#C0479A; --sc-4:#5FA83A; --sc-5:#8A63D2; --sc-6:#C98A1B; --sc-7:#8A93A3;
  --g1-bg:#D6F0E0; --g1-fg:#17603A; --g2-bg:#DCE7FB; --g2-fg:#22488F; --g3-bg:#FFF0C9; --g3-fg:#7A5405; --g4-bg:#FBDEDA; --g4-fg:#9A2E22;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --g1-bg:#1F4A31; --g1-fg:#B8EBCB; --g2-bg:#223A66; --g2-fg:#C6D8FA; --g3-bg:#54410F; --g3-fg:#FBE3A6; --g4-bg:#5C2620; --g4-fg:#F8C9C2}}
:root[data-theme="dark"]{--g1-bg:#1F4A31; --g1-fg:#B8EBCB; --g2-bg:#223A66; --g2-fg:#C6D8FA; --g3-bg:#54410F; --g3-fg:#FBE3A6; --g4-bg:#5C2620; --g4-fg:#F8C9C2}
.g1{background:var(--g1-bg);color:var(--g1-fg)} .g2{background:var(--g2-bg);color:var(--g2-fg)} .g3{background:var(--g3-bg);color:var(--g3-fg)} .g4{background:var(--g4-bg);color:var(--g4-fg)}
.gchip{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.stab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 10px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.stab .blk{width:12px;height:12px;border-radius:3px;background:var(--sc)}
.stab small{color:var(--muted);font-variant-numeric:tabular-nums}
.stab[aria-pressed="true"]{border-color:var(--sc,var(--accent));box-shadow:inset 0 0 0 1px var(--sc,var(--accent));font-weight:700}
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
table.matrix{min-width:0;width:max-content;border-collapse:separate;border-spacing:0}
.matrix th,.matrix td{padding:7px 10px;white-space:nowrap}
.matrix .c-no{position:sticky;left:0;z-index:2;background:var(--surface);width:44px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.matrix .c-nm{position:sticky;left:44px;z-index:2;background:var(--surface);font-weight:700;border-right:1px solid var(--line);min-width:76px}
.matrix thead .c-no,.matrix thead .c-nm{background:var(--bg);z-index:3}
.matrix .subjhead{background:var(--sc);color:#fff;font-size:13px;font-weight:700;letter-spacing:.5px;text-align:left;border-bottom:none}
.matrix .unit{background:var(--bg);vertical-align:bottom;min-width:104px}
.matrix .unit button{border:none;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:1px;color:var(--ink);font-weight:500;font-size:13px;max-width:150px;white-space:normal}
.matrix .unit button small{color:var(--muted);font-weight:400;font-size:11px}
.matrix .unit button:hover{color:var(--accent)}
.matrix .first{border-left:5px solid var(--sc)}
.matrix td.cell{min-width:104px}
.matrix td.cell .sc{font-size:12px;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.matrix td.cell input{width:64px;display:inline-block}
.matrix tfoot td{background:var(--bg);font-size:11px;color:var(--muted);border-bottom:none}
.matrix tfoot .dist{display:flex;gap:3px}
.matrix tfoot .dist span{padding:1px 5px;border-radius:4px;font-weight:700;font-variant-numeric:tabular-nums}
.matrix tbody tr:hover td{background:var(--accent-soft)}
.subjpick{display:flex;gap:6px;flex-wrap:wrap}
.subjpick label{cursor:pointer}
.subjpick input{position:absolute;opacity:0;pointer-events:none}
.subjpick span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--ink)}
.subjpick span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--sc)}
.subjpick input:checked+span{background:var(--sc);border-color:var(--sc);color:#fff;font-weight:700}
.subjpick input:checked+span::before{background:#fff}
.subjpick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.cuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:480px){.cuts{grid-template-columns:1fr 1fr}}
.cut{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:10px}
.cut b{font-size:13px}
.cut .r{display:flex;align-items:center;gap:6px;font-size:13px}
.cut input{width:100%;min-width:0;border:1px solid transparent;background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 8px;font-variant-numeric:tabular-nums}
.sgroup{display:flex;flex-direction:column;gap:10px}
.sgroup h3{display:flex;align-items:center;gap:8px;font-size:16px}
.sgroup h3 .blk{width:6px;height:20px;border-radius:3px;background:var(--sc)}
.examrow.withsub{border-left:5px solid var(--sc)}
/* 공유 게시판 */
:root{--pad-0:#FFF3C4;--pad-1:#DDF0FF;--pad-2:#E3F6E0;--pad-3:#FBE3EE;--pad-4:#ECE5FB;--pad-5:#FFE6D5;--pad-ink:#1C2230}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pad-0:#4A3F16;--pad-1:#1E3A52;--pad-2:#23422A;--pad-3:#4A2536;--pad-4:#342B52;--pad-5:#4D3222;--pad-ink:#EEF1F6}}
:root[data-theme="dark"]{--pad-0:#4A3F16;--pad-1:#1E3A52;--pad-2:#23422A;--pad-3:#4A2536;--pad-4:#342B52;--pad-5:#4D3222;--pad-ink:#EEF1F6}
.board{columns:250px;column-gap:14px}
.post{break-inside:avoid;margin:0 0 14px;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;color:var(--pad-ink);box-shadow:var(--shadow)}
.post .ph{border-radius:10px;width:100%;display:block}
.post .ph-wait{height:120px;border-radius:10px;background:rgba(127,127,127,.15);display:grid;place-items:center;font-size:12px;opacity:.7}
.post .who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.post .who .n{font-family:var(--f-display);font-size:20px;font-weight:400;opacity:.7}
.post .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.6}

.w-pend{box-shadow:inset 0 0 0 2px var(--st-sent);}
.c-pend{box-shadow:inset 0 0 0 2px var(--st-sent)}
.wst.haspend{background:var(--st-sent-soft)!important}

.lkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}

.lktx b{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.lktx span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lkgo{font-size:12px;font-weight:700;color:var(--accent);flex:none}
.c-holi{background:var(--st-none);color:var(--st-none-ink)}
.c-abs{background:color-mix(in srgb, var(--muted) 16%, var(--surface));color:var(--ink)}
span.cbtn{display:inline-flex;align-items:center;justify-content:center;height:30px;cursor:default}
span.ovb{cursor:default}
.holitag{display:block;font-size:10px!important;color:var(--st-sent)!important;font-weight:700!important}
.pk:disabled{opacity:.55;cursor:not-allowed}
.w-abs{color:var(--ink);background:color-mix(in srgb, var(--muted) 16%, var(--surface));font-family:var(--f-body);font-size:12px;font-weight:700}
.dd-abs{background:color-mix(in srgb, var(--muted) 16%, var(--surface));color:var(--ink);font-family:var(--f-body);font-size:13px;font-weight:700}
.tkadd{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tkadd #tkD{width:auto;flex:0 0 auto}.tkadd #tkT{flex:1 1 220px;min-width:0}
.tkwrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

.tktbl th,.tktbl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;background:var(--surface)}
.tktbl thead th{position:sticky;top:0;z-index:2;background:var(--bg)}
.tktbl .tks{position:sticky;left:0;z-index:1;text-align:left;padding:6px 12px;white-space:nowrap;font-weight:500;min-width:96px}
.tktbl .tks b{display:inline-block;min-width:20px;color:var(--muted)}
.tktbl thead .tkcorner{z-index:3;background:var(--bg);font-size:12px;color:var(--muted)}
.tktbl .tkpad{border-right:0;width:100%}
.tkhb{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;width:84px;box-sizing:border-box;text-align:center}
.tkhb:hover{background:var(--accent-soft)}.tkhb:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tkd{font-size:11px;color:var(--muted)}.tkt{font-weight:700;font-size:13px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.tkn{font-size:11px;color:var(--muted);font-weight:600}.tkn.tkfull{color:var(--st-done)}
.tkclosed .tkhb{opacity:.55}
.tkc{all:unset;cursor:pointer;display:grid;place-items:center;width:84px;height:34px;font-weight:800;font-size:17px;color:var(--st-done-ink);box-sizing:border-box}
.tkc:hover{background:var(--accent-soft)}.tkc.on{background:var(--st-done)}.tkc:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tktbl tbody tr:hover .tks{background:var(--accent-soft)}
.dmcard{background:var(--st-done-soft);color:var(--st-done);border:1.5px solid color-mix(in srgb, var(--st-done) 45%, var(--surface))}
.dmcard .lkname{color:var(--ink)}
.dmto{font-size:12px;font-weight:700;opacity:.9}
.dmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.dmrow .tdcat{color:var(--st-done)}
.boardhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
/* 파스텔 딱지 */
.rchip,.numtag{background:color-mix(in srgb, var(--tc) 24%, var(--surface))!important;color:color-mix(in srgb, var(--tc) 70%, var(--ink))!important;border:1px solid color-mix(in srgb, var(--tc) 35%, var(--surface))}
.sjtag,.reccat{background:color-mix(in srgb, var(--sc) 24%, var(--surface))!important;color:color-mix(in srgb, var(--sc) 70%, var(--ink))!important;border:1px solid color-mix(in srgb, var(--sc) 35%, var(--surface))}
.matrix .subjhead{background:color-mix(in srgb, var(--sc) 30%, var(--surface))!important;color:color-mix(in srgb, var(--sc) 70%, var(--ink))!important}
.subjpick input:checked+span{background:color-mix(in srgb, var(--sc) 28%, var(--surface))!important;border-color:color-mix(in srgb, var(--sc) 60%, var(--surface))!important;color:color-mix(in srgb, var(--sc) 70%, var(--ink))!important}
.subjpick input:checked+span::before{background:var(--sc)!important}
.tdblk,.dgblk{background:color-mix(in srgb, var(--tc) 55%, var(--surface))!important}
.tdlg{border-left-color:color-mix(in srgb, var(--tc) 55%, var(--surface));background:color-mix(in srgb, var(--tc) 14%, var(--surface))}
.stab .blk,.sgroup h3 .blk{background:color-mix(in srgb, var(--sc) 60%, var(--surface))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>우리 반 과제함</h1><small id="modeLabel"></small></div>
    <div class="who" id="who"></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="todo" aria-selected="false">ToDoList <span id="tdBadge"></span></button>
    <button class="tab" role="tab" data-tab="links" aria-selected="false">링크함/알림장 <span id="lkBadge"></span></button>
    <button class="tab" role="tab" data-tab="hw" aria-selected="true">개인과제</button>
    <button class="tab" role="tab" data-tab="board" aria-selected="false">공유보드</button>
    <button class="tab" role="tab" data-tab="idea" aria-selected="false">생각모으기</button>
    <button class="tab" role="tab" data-tab="tchk" aria-selected="false" hidden>체크리스트</button>
    <button class="tab" role="tab" data-tab="exam" aria-selected="false">수행평가 <span id="retakeBadge"></span></button>
    <button class="tab" role="tab" data-tab="records" aria-selected="false" hidden>누가기록</button>
    <button class="tab" role="tab" data-tab="students" aria-selected="false" hidden>학생 관리</button>
  </nav>
  <main id="main"><div class="panel empty"><h3>불러오는 중…</h3></div></main>
</div>
<div id="sheetRoot"></div>
<div id="bigRoot"></div>
<div id="popRoot"></div>
<div id="toastRoot"></div>

<script src="db.js"></script>
<script>
(() => {
/* ---------- state ---------- */
const COLS = ["students","assignments","submissions","notices","exams","retakes","records","ideas","ideaAnswers","todos","todoDone","pins","pinsPlain","secret","backupInfo","links","dayoff","absent","dms","dmDone","tchk","seen"];
const S = {}; COLS.forEach(c => S[c] = {}); S.backups = {};
let db = null, isTeacher = true, loaded = false; // isTeacher: '선생님 로그인' 링크를 보여 줄지 (웹에서는 누구나 비밀번호로 시도해요)
const ui = { subj:"전체", tab:"hw", role:"student", me:null, selA:null, selE:null, sheet:null, confirm:null };
ui.me = null;
const failCount = {}; let tFail = 0, lockUntil = 0;
/* 로그인 상태: 서버가 확인한 토큰으로 판단해요 (체험 모드에서는 모두 열림) */
const tUnlocked = () => !db || db.auth.role==="t";
function applyGate(){ if(ui.role==="teacher" && !tUnlocked()) ui.role="student"; if(db && ui.me && !(db.auth.role==="s" && db.auth.no===+ui.me)) ui.me=null; }
try { const t = localStorage.getItem("tab"); if (t) ui.tab = t; } catch(e){}
if (location.hash === "#exam") ui.tab = "exam";

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmt = iso => { if(!iso) return ""; const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const fmtDate = s => { if(!s) return ""; const [y,m,d] = s.split("-"); return `${+m}월 ${+d}일`; };
const students = () => Object.values(S.students).sort((a,b)=>a.no-b.no);
const assigns = () => Object.values(S.assignments).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
const exams = () => Object.values(S.exams).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
const subOf = (aid,no) => S.submissions[`${aid}__${no}`];
const statusOf = (aid,no) => { const s = subOf(aid,no); return !s ? "wait" : s.status === "checked" ? "done" : s.status === "returned" ? "back" : "sent"; };
const OK_STAMPS = ["최고!👍🏻✨","고생했어요🍀","다음엔 조금 더 자세히📝"];
const ST = { wait:{t:"미제출",c:"s-wait"}, sent:{t:"제출함 · 확인 전",c:"s-sent"}, done:{t:"확인 완료",c:"s-done"}, back:{t:"반려 · 다시 제출 대기",c:"s-wait"} };
const SUBJ = ["국어","수학","사회","미술","체육","도덕","실과"];
const GR = [["매우잘함","g1"],["잘함","g2"],["보통","g3"],["노력요함","g4"]];
const cutOf = e => e.cut || {a:Math.round(e.max*.9), b:Math.round(e.max*.8), c:Math.round(e.max*.7)};
const gradeOf = (e,v) => { if(v===undefined||v===null||v==="") return null; const c=cutOf(e); v=+v; return v>c.a?0:v>c.b?1:v>c.c?2:3; };
const ST_STUDENT = { wait:{t:"아직 안 냈어요",c:"s-wait"}, sent:{t:"제출 완료 · 선생님 확인 중",c:"s-sent"}, done:{t:"선생님 확인 완료",c:"s-done"}, back:{t:"반려됨 · 다시 내 주세요",c:"s-wait"} };

/* ---------- store ---------- */
function toast(msg){ const r=$("#toastRoot"); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML="",2600); }
function fail(e){ console.error(e); const c=e&&e.code; if(c==="not_logged_in"||c==="session_expired"){ toast("로그인이 풀렸어요. 다시 들어와 주세요."); return; } if(c==="unavailable"){ toast("서버에 연결할 수 없어요. 인터넷 연결을 확인해 주세요."); return; } if(e && e.status && e.message && c!=="permission_denied"){ toast(/컬렉션|주소가 올바르지/.test(e.message) ? "서버 파일이 예전 버전이에요. functions/api/[[path]].js를 최신 파일로 다시 올려 주세요." : e.message); return; } toast(c==="not_granted"||c==="permission_denied"||c==="invalid_argument" ? "저장 권한이 없어요. 선생님께 편집 권한을 받아 주세요." : c==="quota_exceeded" ? "저장 공간이 가득 찼어요. 오래된 과제를 지워 주세요." : "저장하지 못했어요. 잠시 후 다시 시도해 주세요."); }
async function put(col,id,data){ try{ if(db) await db.collection(col).doc(id).set(data); else { S[col][id]=data; refresh(); } return true; }catch(e){ fail(e); return false; } }
async function patch(col,id,data){ try{ if(db) await db.collection(col).doc(id).update(data); else { const cur=S[col][id]||{}; for(const k in data){ cur[k] = (data[k] && typeof data[k]==="object" && !Array.isArray(data[k]) && cur[k] && typeof cur[k]==="object") ? {...cur[k],...data[k]} : data[k]; } S[col][id]=cur; refresh(); } return true; }catch(e){ fail(e); return false; } }
async function del(col,id){ try{ if(db) await db.collection(col).doc(id).delete(); else { delete S[col][id]; refresh(); } return true; }catch(e){ fail(e); return false; } }
const photoCache = {};
async function getPhoto(id){ if(id in photoCache) return photoCache[id]; if(!db) return photoCache[id]||null; try{ const s=await db.collection("photos").doc(id).get(); photoCache[id]= s.exists ? s.data().src : null; }catch(e){ photoCache[id]=null; } return photoCache[id]; }
async function putPhoto(id,src){ photoCache[id]=src; if(!db) return true; try{ await db.collection("photos").doc(id).set({src}); return true; }catch(e){ fail(e); return false; } }

/* ---------- render scheduling (don't clobber typing) ---------- */
let pendMain=false, pendSheet=false;
const typing = root => { const a=document.activeElement; return a && root.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type!=="file"; };
function refresh(){ if($("#bigCloud")) drawIdea(); if(ui.bigHw) renderHwBig(); if(typing($("#main"))) pendMain=true; else renderMain(); if(ui.sheet && (ui.sheet.type==="sub" || ui.sheet.type==="my" || (ui.sheet.type==="post" && !ui.postEdit) || ui.sheet.type==="holi" || ui.sheet.type==="abs" || ui.sheet.type==="dmview")){ if(typing($("#sheetRoot"))) pendSheet=true; else renderSheet(); } renderChrome(); }
document.addEventListener("focusout", () => setTimeout(()=>{ if(pendMain && !typing($("#main"))){pendMain=false;renderMain();} if(pendSheet && !typing($("#sheetRoot"))){pendSheet=false;renderSheet();} },0));

/* ---------- chrome ---------- */
function renderChrome(){
  if(loaded) applyGate();
  document.querySelectorAll('.tab[data-tab="students"],.tab[data-tab="records"],.tab[data-tab="tchk"]').forEach(b=>b.hidden = ui.role!=="teacher");
  if(ui.role!=="teacher" && (ui.tab==="students"||ui.tab==="records"||ui.tab==="tchk")) ui.tab="hw";
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===ui.tab)));
  const pend = Object.values(S.retakes).filter(r=>r.status==="pending").length;
  $("#retakeBadge").innerHTML = ui.role==="teacher" && pend ? `<span class="badge">${pend}</span>` : "";
  const nb = ui.role==="student" && S.students[ui.me] ? newCounts(+ui.me) : {links:0,todo:0};
  $("#lkBadge").innerHTML = nb.links && ui.tab!=="links" ? `<span class="badge">${nb.links}</span>` : "";
  $("#tdBadge").innerHTML = nb.todo && ui.tab!=="todo" ? `<span class="badge">${nb.todo}</span>` : "";
  if(nb.links && ui.tab==="links") markSeen(+ui.me,"links");
  if(nb.todo && ui.tab==="todo") markSeen(+ui.me,"todo");
  const w=$("#who"); let h="";
  if(!db) h += `<span class="demo">체험 모드 · 서버 연결 안 됨</span>`;
  if(ui.role==="teacher"){ h += `<span class="pill">선생님 화면</span>`; if(isTeacher) h+=`<button class="linkbtn" data-act="asStudent">학생 화면으로 보기</button>`; }
  else { const me = S.students[ui.me]; h += me ? `<span class="pill"><b>${me.no}번</b> ${esc(me.name)}</span><button class="linkbtn" data-act="myPin">비밀번호 설정</button><button class="linkbtn" data-act="logout">나가기</button>` : ""; if(isTeacher) h+=`<button class="linkbtn" data-act="asTeacher">${tUnlocked()?"선생님 화면으로":"🔒 선생님 로그인"}</button>`; }
  w.innerHTML = h;
  $("#modeLabel").textContent = ui.role==="teacher" ? `학생 ${students().length}명` : "";
}

/* ---------- main ---------- */
function renderMain(){
  const m=$("#main"); if(loaded) applyGate();
  if(!loaded){ m.innerHTML=`<div class="panel empty"><h3>불러오는 중…</h3></div>`; return; }
  if(ui.role==="student" && !S.students[ui.me]) { m.innerHTML = pickView(); return; }
  if((ui.tab==="students"||ui.tab==="records"||ui.tab==="tchk") && ui.role!=="teacher") ui.tab="hw";
  if(ui.tab==="tchk") { m.innerHTML = tchkView(); return; }
  if(ui.tab==="records") { m.innerHTML = recordsView(); return; }
  if(ui.tab==="students") { m.innerHTML = studentsView(); return; }
  if(ui.tab==="todo") { m.innerHTML = todoView(); return; }
  if(ui.tab==="links") { m.innerHTML = linksView(); return; }
  if(ui.tab==="board") { m.innerHTML = boardView(); hydratePhotos(); return; }
  if(ui.tab==="idea") { m.innerHTML = ideaView(); drawIdea(); return; }

/* 백업 · 복원 */
const BK_COLS = () => [...COLS.filter(c=>c!=="backupInfo"), "photos"];
const BK_CHUNK = 60000;
let bkBusy = false;
/* 일반 웹에서는 브라우저 다운로드로 파일을 저장해요 */
const dlApi = { save: async ({filename, data}) => { const blob = data instanceof Blob ? data : new Blob([data]); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 5000); } };
const fmtFull = iso => { const d=new Date(iso); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,"0")}시 ${String(d.getMinutes()).padStart(2,"0")}분`; };
async function readAll(c){ if(!db){ if(c==="photos"){ const o={}; for(const k in photoCache) if(photoCache[k]) o[k]={src:photoCache[k]}; return o; } return JSON.parse(JSON.stringify(S[c]||{})); }
  const snap = await db.collection(c).get(); const o={}; snap.docs.forEach(x=>{ o[x.id]=x.data(); }); return o; }
async function collectData(){ const data={}; for(const c of BK_COLS()) data[c]=await readAll(c); return data; }
const countsOf = data => Object.fromEntries(Object.entries(data).map(([c,o])=>[c,Object.keys(o).length]));
function bkProgress(msg){ const r=$("#toastRoot"); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); }
async function doBackup(){ if(bkBusy) return; bkBusy=true; try{
  bkProgress("백업하는 중…"); const at=new Date().toISOString(); const data=await collectData();
  const str=JSON.stringify({v:1, at, data}); const n=Math.ceil(str.length/BK_CHUNK);
  const prevN = S.backupInfo?.latest?.chunks || 0;
  for(let i=0;i<n;i++){ bkProgress(`백업하는 중… ${i+1}/${n}`); if(!(await put("backups",`c${i}`,{s:str.slice(i*BK_CHUNK,(i+1)*BK_CHUNK)}))) throw new Error("save"); }
  for(let i=n;i<prevN;i++) await del("backups",`c${i}`);
  const counts=countsOf(data);
  if(await put("backupInfo","latest",{at, chunks:n, size:str.length, counts})) { renderMain(); toast(`${fmtFull(at)}까지의 기록을 백업했어요.`); }
  }catch(e){ console.error(e); toast("백업하지 못했어요. 잠시 후 다시 해 주세요."); } finally{ bkBusy=false; } }
async function loadBackup(){ const meta=S.backupInfo?.latest; if(!meta) return null; let str="";
  for(let i=0;i<meta.chunks;i++){ if(!db){ str+=S.backups?.[`c${i}`]?.s||""; continue; } const d=await db.collection("backups").doc(`c${i}`).get(); if(!d.exists) throw new Error("missing chunk"); str+=d.data().s; }
  return JSON.parse(str); }
async function applyRestore(pack){ if(bkBusy) return; bkBusy=true; try{
  const data=pack.data||{}; const cols=BK_COLS().filter(c=>data[c]); let total=cols.reduce((a,c)=>a+Object.keys(data[c]).length,0), n=0;
  for(const c of cols){ const cur = await readAll(c); const want=data[c];
    for(const id of Object.keys(cur)) if(!(id in want)){ await del(c,id); }
    for(const [id,doc] of Object.entries(want)){ n++; if(n%5===0||n===total) bkProgress(`복원하는 중… ${n}/${total}`); if(JSON.stringify(cur[id])===JSON.stringify(doc)) continue; if(c==="photos"){ photoCache[id]=doc.src; if(!db) continue; } await put(c,id,doc); } }

function instancesOf(t, days){

  const start = parseD(t.start || (t.createdAt||"").slice(0,10) || ymd(today0()));
  if(t.type==="daily"){ const end = t.endedAt ? parseD(t.endedAt) : today0();
    const back=-(days||14); let d = start < addDays(today0(),back) ? addDays(today0(),back) : start; const out=[];
    for(; d<=end; d=addDays(d,1)){ const w=d.getDay(); if(!t.weekends && (w===0||w===6)) continue; out.push({period:ymd(d), due:new Date(d), label:md(d)}); }
    return out.reverse(); }
  const off=((t.weekday??5)+6)%7;
  let firstW = mondayOf(start); if(addDays(firstW,off)<start) firstW=addDays(firstW,7);

  let w = firstW; const minW = addDays(mondayOf(today0()), -7*8); if(w<minW) w=minW;
  const mk = w => { const period=ymd(w); const idx=Math.round(dayDiff(w,firstW)/7); const num = t.numOn ? String((t.nums||{})[period] ?? ((+t.numStart||1)+idx)) : null;

function dailyMatrix(t, ins, asChecker){

let cloudCtx=null;
function drawCloud(el, items, opts={}){
  if(!el || !items.length) return;
  const W = el.clientWidth || el.parentElement.clientWidth || 600;
  const maxC = items[0].count, n = items.length;
  const big = opts.big ? 1.8 : 1;
  const maxF = Math.min(W/5.5, (n<=5?78:n<=15?64:n<=40?52:42)*big), minF = Math.max(14, maxF*0.26);
  cloudCtx = cloudCtx || document.createElement("canvas").getContext("2d");
  const placed=[]; const out=[];
  items.forEach((e,i)=>{
    const r = maxC===1 ? (n<=8?0.5:0.25) : (e.count-1)/(maxC-1);
    const fs = Math.round(minF + (maxF-minF)*Math.sqrt(r));
    cloudCtx.font = `800 ${fs}px "Noto Sans KR", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
    const w = Math.ceil(cloudCtx.measureText(e.text).width)+fs*0.25, h = Math.ceil(fs*1.15);
    let x=0,y=0,t=0, ok=false;
    for(let k=0;k<4000;k++){ x = 1.9*t*Math.cos(t)*fs*0.12 - w/2; y = t*Math.sin(t)*fs*0.12 - h/2;
      if(!placed.some(p=> x < p.x+p.w+3 && x+w+3 > p.x && y < p.y+p.h+1 && y+h+1 > p.y)){ ok=true; break; } t += 0.12; }
    placed.push({x,y,w,h}); out.push({e,x,y,w,h,fs,i});
  });
  const minX=Math.min(...placed.map(p=>p.x)), maxX=Math.max(...placed.map(p=>p.x+p.w)), minY=Math.min(...placed.map(p=>p.y)), maxY=Math.max(...placed.map(p=>p.y+p.h));
  const bw=maxX-minX, bh=maxY-minY; const sc = opts.big ? Math.min((W-8)/bw, (window.innerHeight-150)/bh, 3) : Math.min(1, (W-8)/bw);
  el.style.height = Math.ceil(bh*sc+16)+"px";
  const T = ui.role==="teacher" && !opts.big;
  el.innerHTML = out.map(o=>`<${T?"button":"span"} class="cw" ${T?`data-act="askHide" data-k="${esc(o.e.k)}"`:""} title="${o.e.count}명" style="left:${((o.x-minX)*sc + (W-bw*sc)/2).toFixed(1)}px;top:${((o.y-minY)*sc+8).toFixed(1)}px;font-size:${(o.fs*sc).toFixed(1)}px;color:var(--sc-${o.i%7});${o.i===0&&maxC>1?"font-weight:700;":""}">${esc(o.e.text)}${o.e.count>1?`<sup>${o.e.count}</sup>`:""}</${T?"button":"span"}>`).join("");
}

    table = `<div class="tablewrap"><table class="matrix"><thead><tr><th class="c-no" rowspan="2">번호</th><th class="c-nm" rowspan="2">이름</th>${head1}</tr><tr>${head2}</tr></thead><tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div>`;
  }
  const reqs = Object.values(S.retakes).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")).filter(r=> cur==="전체" || S.exams[r.examId]?.subject===cur);
  const RS = {pending:["검토 중","s-sent"],approved:["승인","s-done"],rejected:["반려","s-none"]};
  const reqHtml = `<section class="panel"><h2>재시험 신청 <span class="muted">${reqs.filter(r=>r.status==="pending").length}건 대기</span></h2>${reqs.length? `<div class="list">${reqs.map(r=>{ const s=S.students[r.no]; const e=S.exams[r.examId]; const gi=e?Math.max(0,SUBJ.indexOf(e.subject)):7; const v=e?(e.scores||{})[r.no]:null;

  return `<div class="list">${tabs}<section class="panel"><div class="ahead"><h2>${cur==="전체"?"전체 수행평가 결과":`${cur} 수행평가`}</h2><button class="btn primary" data-act="newE">＋ 수행평가 추가</button></div>${flat.length?legend:""}${table}</section>${reqHtml}</div>`;
}

/* student · exam */
function studentExam(){
  const me = S.students[ui.me]; const groups = examGroups(exams());
  if(!groups.length) return `<section class="panel empty"><h3>아직 수행평가 결과가 없어요</h3><p>선생님이 점수를 입력하면 여기에서 바로 볼 수 있어요.</p></section>`;
  const RS = {pending:["재시험 신청 · 검토 중","s-sent"],approved:["재시험 승인","s-done"],rejected:["재시험 반려","s-none"]};
  const row = (e,g) => {
    const v = (e.scores||{})[me.no]; const has = v!==undefined && v!==null && v!=="";
    const c = (e.comments||{})[me.no]; const gr = gradeOf(e,v);
    const req = Object.values(S.retakes).filter(r=>r.examId===e.id && r.no===me.no).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""))[0];
    const form = ui.confirm===`retake_${e.id}` ? `<label class="f" for="why_${e.id}">재시험을 보고 싶은 이유<textarea class="inp" id="why_${e.id}" style="min-height:80px" placeholder="예: 실수한 부분을 다시 연습했어요."></textarea></label><div class="actions"><button class="btn ghost" data-act="cancelConfirm">취소</button><button class="btn primary" data-act="sendRetake" data-id="${e.id}">신청하기</button></div>` : "";
    const canAsk = has && (!req || req.status!=="pending") && !form;
    return `<div class="examrow withsub" style="--sc:var(--sc-${g.i})"><div class="top2"><div><b>${esc(e.unit||e.title)}</b><div class="muted">${e.date?fmtDate(e.date):""}</div></div><div style="display:flex;align-items:center;gap:10px">${gr===null?`<span class="muted">채점 전</span>`:`<span class="gchip ${GR[gr][1]}" style="font-size:15px;padding:6px 12px">${GR[gr][0]}</span><span class="muted" style="font-variant-numeric:tabular-nums">${esc(v)} / ${e.max}점</span>`}</div></div>
      ${c?`<div class="feedback">${esc(c)}</div>`:""}
      ${req?`<div><span class="status ${RS[req.status][1]}">${RS[req.status][0]}</span>${req.reply?` <span class="muted">선생님: ${esc(req.reply)}</span>`:""}</div>`:""}
      ${form}${canAsk?`<div><button class="btn" data-act="askRetake" data-id="${e.id}">재시험 신청</button></div>`:""}</div>`;
  };
  return `<section class="panel"><div class="ahead"><h2>${esc(me.name)}의 수행평가</h2><span class="muted">내 결과만 보여요</span></div>
    <div class="legend">${GR.map(([t,c])=>`<span class="gchip ${c}">${t}</span>`).join("")}</div>
    ${groups.map(g=>`<div class="sgroup" style="--sc:var(--sc-${g.i})"><h3><span class="blk"></span>${esc(g.name)}</h3>${g.exams.map(e=>row(e,g)).join("")}</div>`).join("")}</section>`;
}

/* image compress to fit a 256 KiB document */
function compress(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=rej; fr.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{ let max=1280, q=.8, out=""; for(let i=0;i<8;i++){ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); out=c.toDataURL("image/jpeg",q); if(out.length<200000) break; if(q>.5) q-=.1; else max=Math.round(max*.8); } res(out); }; im.src=fr.result; }; fr.readAsDataURL(file); }); }

  if(t.id==="tdNumOn"){ const g=$("#tdNumBox"); if(g) g.hidden=!t.checked; return; }
  if(t.name==="tdCat" && !ui.sheet?.id){ const ty=TD_DEFTYPE[t.value]; const r=document.querySelector(`input[name=tdType][value=${ty}]`); if(r){ r.checked=true; document.querySelectorAll("[data-tdtype]").forEach(el=>el.hidden = el.dataset.tdtype!==ty); }
    const wd=$("#tdW"); if(wd) wd.value=String(TD_DEFWD[t.value]??5); const nu=$("#tdNU"); if(nu && TD_DEFUNIT[t.value]) nu.value=TD_DEFUNIT[t.value];
    const no=$("#tdNumOn"); if(no){ no.checked = !!TD_DEFUNIT[t.value]; const g=$("#tdNumBox"); if(g) g.hidden=!no.checked; } return; }
  if(t.name==="tdType"){ document.querySelectorAll("[data-tdtype]").forEach(el=>el.hidden = el.dataset.tdtype!==t.value); return; }
  if(t.name==="recCat"){ ui.recCat=t.value; return; }
  if(["cA","cB","cC"].includes(t.id)){ const d=$("#cD"); if(d) d.textContent=`${$("#cC").value||0}점 미만`; return; }
  if(t.dataset?.act==="sname"){ const no=+t.dataset.no; const name=t.value.trim(); const cur=S.students[no]; if(!cur) return; if(!name){ t.value=cur.name; toast("이름을 비울 수 없어요."); return; } if(name!==cur.name && await put("students",String(no),{no,name})) toast(`${no}번 이름을 ${name}(으)로 바꿨어요.`); return; }
  if(t.dataset?.act!=="score") return;
  const e=S.exams[t.dataset.eid]; if(!e) return; const no=t.dataset.no;
  let v=t.value.trim(); if(v!==""){ v=+v; if(isNaN(v)||v<0||v>e.max){ toast(`0~${e.max} 사이 숫자를 넣어 주세요.`); t.value=(e.scores||{})[no]??""; return; } }
  await patch("exams",e.id,{scores:{[no]:v===""?null:v}});
});

    if(!data.title) return; if(type==="once" && !data.due){ toast("마감일을 골라 주세요."); return; }
    if(sid){ if(await patch("todos",sid,data)){ closeSheet(); toast("저장했어요."); } }
    else { const id=uid(); if(await put("todos",id,{id,...data,createdAt:new Date().toISOString()})){ ui.tdSel=id; closeSheet(); renderMain(); toast("학생들에게 보냈어요."); } } }
  if(f.id==="fIdeaQ"){ const sid=ui.sheet.id; const data={ title:$("#iqT").value.trim(), desc:$("#iqD").value.trim(), per:+$("#iqP").value||3, subject:f.querySelector("input[name=iqS]:checked")?.value||"" }; if(!data.title) return;
    if(sid){ if(await patch("ideas",sid,data)){ closeSheet(); toast("저장했어요."); } }
    else { const id=uid(); if(await put("ideas",id,{id,...data,hidden:[],closed:false,createdAt:new Date().toISOString()})){ ui.idea=id; closeSheet(); renderMain(); toast("질문을 냈어요."); } } }
  if(f.id==="fIdea"){ const q=S.ideas[ui.idea]; if(!q||q.closed) return; const words=[...f.querySelectorAll("input")].map(i=>normW(i.value)).filter(Boolean);
    if(!words.length){ toast("답을 하나 이상 써 주세요."); return; }
    const k=`${q.id}__${ui.me}`; if(await put("ideaAnswers",k,{qid:q.id,no:+ui.me,words,at:new Date().toISOString()})){ toast("생각을 보냈어요!"); renderMain(); } }
  if(f.id==="fRec"){ const date=$("#recDate").value, text=$("#recText").value.trim(), cat=f.querySelector("input[name=recCat]:checked")?.value||"기타";
    if(!date){ toast("날짜를 골라 주세요."); return; } if(!ui.recSel.length){ toast("학생을 한 명 이상 골라 주세요."); return; } if(!text){ toast("내용을 적어 주세요."); return; }
    let n=0; for(const no of [...ui.recSel].sort((a,b)=>a-b)){ const id=uid(); if(await put("records",id,{id,no,date,cat,text,createdAt:new Date().toISOString()})) n++; }
    if(n){ ui.recText=""; ui.recSel=[]; ui.recDate=date; ui.recCat=cat; renderMain(); toast(`${n}명에게 기록을 남겼어요.`); } }
  if(f.id==="fRecEdit"){ const id=f.dataset.id; if(await patch("records",id,{date:$("#reDate").value, cat:$("#reCat").value, text:$("#reText").value.trim(), editedAt:new Date().toISOString()})){ ui.recEdit=null; renderMain(); toast("기록을 고쳤어요."); } }
  if(f.id==="fAddRow"){ const no=+$("#arNo").value, name=$("#arName").value.trim(); if(!no||!name) return; if(S.students[no]){ toast(`${no}번은 이미 ${S.students[no].name}(으)로 있어요.`); return; } if(await put("students",String(no),{no,name})){ toast(`${no}번 ${name}을(를) 등록했어요.`); renderMain(); setTimeout(()=>$("#arNo")?.focus(),0); } }
  if(f.id==="fBulk"){ const lines=$("#bulkT").value.split(/\n/).map(l=>l.trim()).filter(Boolean); let n=0, bad=[]; for(const l of lines){ const m=l.match(/^(\d+)\s*[.,번)]?\s*(.+)$/); if(!m){ bad.push(l); continue; } const no=+m[1], name=m[2].trim(); if(await put("students",String(no),{no,name})) n++; } ui.bulk = bad.length>0; renderMain(); toast(`${n}명을 등록했어요.${bad.length?` 형식이 맞지 않는 줄 ${bad.length}개는 건너뛰었어요.`:""}`); }
  if(f.id==="fStudent"){ const no=+$("#sN").value, name=$("#sM").value.trim(); if(!no||!name) return; if(!ui.sheet.no && S.students[no]){ toast(`${no}번은 이미 있어요.`); return; } if(await put("students",String(no),{no,name})){ closeSheet(); toast("명단을 저장했어요."); } }
  if(f.id==="fSub"){ const a=S.assignments[ui.sheet.id]; const me=+ui.me; const pf=$("#pF"), tf=$("#tF"); const src=pf?._src||null; const text=tf?tf.value.trim():"";
    const title=$("#tTi")?.value.trim()||""; const linkRaw=$("#lF")?.value.trim()||""; const link=safeUrl(linkRaw);
    if(linkRaw && !link){ toast("링크 주소를 다시 확인해 주세요."); return; }
    const prev=subOf(a.id,me);
    if(a.kind==="photo" && !src && !prev?.hasPhoto){ toast("사진을 골라 주세요."); return; }
    if(a.kind==="text" && !text && !link){ toast("글을 써 주세요."); return; }
    if(a.kind==="both" && !src && !text && !link && !prev?.hasPhoto){ toast("사진이나 글 중 하나는 꼭 내 주세요."); return; }
    const btn=$("#subBtn"); btn.disabled=true; btn.textContent="제출하는 중…";
    const k=`${a.id}__${me}`;
    if(src && !(await putPhoto(k,src))){ btn.disabled=false; btn.textContent="제출하기"; return; }
    if(await put("submissions",k,{aid:a.id,no:me,text,title,link,hasPhoto: !!src || !!prev?.hasPhoto,status:"submitted",hearts:prev?.hearts||{},feedback:"",stamp:"",returnReason:"",resubmits:(prev?.resubmits||0)+(prev?.status==="returned"?1:0),submittedAt:new Date().toISOString()})){ toast("제출했어요! 선생님이 확인하면 초록색으로 바뀌어요."); closeSheet(); }
    else { btn.disabled=false; btn.textContent="제출하기"; } }
});
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="bookIn"){ e.preventDefault(); document.querySelector("[data-act=tdDoneBook]")?.click(); return; } if(e.key==="Escape" && $(".popov")) { $("#popRoot").innerHTML=""; return; } if(e.key==="Escape" && $(".bigov")) { ui.bigHw=null; $("#bigRoot").innerHTML=""; } if(e.key==="Escape" && ui.sheet) closeSheet();
  const t=e.target; if(e.key==="Enter" && t.dataset && t.dataset.act==="score"){ e.preventDefault(); const all=[...document.querySelectorAll(`input[data-act=score][data-eid="${t.dataset.eid}"]`)]; const nx=all[all.indexOf(t)+1]; if(nx) nx.focus(); else t.blur(); } });

/* ---------- boot ---------- */
async function boot(){
  renderChrome(); renderMain();
  const ok = window.ClassDB ? await window.ClassDB.connect() : false;
  if(!ok){ db=null; isTeacher=true; ui.role="teacher"; loaded=true; refresh(); toast("서버(/api)에 연결할 수 없어 체험 모드로 열었어요. 새로고침하면 사라져요."); return; } // 체험 모드: 서버 없이 화면만 미리 보기
  db = window.ClassDB; isTeacher = true;
  ui.role = db.auth.role==="t" ? "teacher" : "student";
  if(db.auth.role==="s") ui.me = String(db.auth.no);
  db.onAuthLost(()=>{ ui.me=null; ui.role="student"; closeSheet(); refresh(); toast("로그인이 풀렸어요. 다시 들어와 주세요."); });
  const got=new Set();
  const mark=c=>{ got.add(c); if(!loaded && got.size>=COLS.length) loaded=true; };
  COLS.forEach(c => db.collection(c).onSnapshot(snap => { const o={}; snap.docs.forEach(x=>{ o[x.id]=x.data(); }); S[c]=o; mark(c); if(loaded) refresh(); }, err => { console.error(err); mark(c); if(loaded) refresh(); }));
  setTimeout(()=>{ if(!loaded){ loaded=true; refresh(); } }, 6000);
}
boot();
})();
</script>
