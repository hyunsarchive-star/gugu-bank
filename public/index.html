const EXRE=/주제 ?글쓰기 ?면제|주글 ?면제|독서록 ?면제|오늘하루[^면]*면제/;
// 면제권 3종 (각각 따로 색깔 블록·통장 분류). 규칙은 exCheck 에서 검사해요.

const EXLIM={t:3}; // 오늘하루 면제권: 한 주에 최대 3번까지 (4번 이상 X). 바꾸려면 이 숫자만 고치면 돼요

 if(kind==='exT'){const n=of('exT').filter(t=>wkIdx(t.date)===w).length;return n>=EXLIM.t?`오늘하루 면제권은 한 주에 4번 이상 쓸 수 없어요 (3번까지) (그 주에 이미 ${n}번)`:''}
 if(of(kind).some(t=>Math.abs(wkIdx(t.date)-w)<=1))return `${EXV[kind].name}은 2주에 한 번만 쓸 수 있어요 (지난주나 이번주에 이미 썼어요)`;
 const o=kind==='exJ'?'exB':'exJ';if(of(o).some(t=>wkIdx(t.date)===w))return '주글 면제권과 독서록 면제권은 같은 주에 함께 쓸 수 없어요';return ''}
const CATS={pay:['tgr','🟩 2주급'],dev:['c-dev','📗 자기 계발'],merit:['c-merit','⭐ 우수 활동'],comm:['c-comm','🤝 공동체 생활'],wel:['c-wel','🎁 복지비'],right:['c-right','🎟 권리 구매'],exempt:['c-exempt','🎫 면제권'],exJ:['c-exj','✏️ 주글 면제권'],exB:['c-exb','📖 독서록 면제권'],exT:['c-ext','☀️ 오늘하루 면제권'],snack:['c-snack','🍬 간식 구매'],fine:['c-fine','🚨 벌금'],taxuse:['c-taxuse','🏛 세금 사용처'],gig:['tye','🟨 아르바이트'],auction:['c-auc','🔨 경매'],adj:['c-adj','⚖️ 잔액 조정'],miss:['c-miss','🚨 오늘하루 미달성'],stock:['tpu','🟪 주식'],estate:['tbl','🟦 부동산'],dep:['t1','🟧 예금'],tax:['tre','🟥 세금·공과금'],etc:['tgy','⬜ 기타']};
function catKey(t){if(t.cat&&t.cat!=='exempt'&&CATS[t.cat])return t.cat;const m=t.memo||'';if(/^아르바이트/.test(m))return 'gig';if(/^경매/.test(m))return 'auction';if(/^잔액 ?조정/.test(m))return 'adj';if(/오늘하루 ?미달성/.test(m))return 'miss';if(t.cat==='exempt'||EXRE.test(m))return exKind(m)||'exempt';if(/^2주급|급여/.test(m))return 'pay';if(/부동산/.test(m))return 'estate';if(/정기예금/.test(m))return 'dep';if(/[A-Z]{3,5}-\d{3}|주식/.test(m))return 'stock';if(/소득세|자릿세|수도|전기|건강보험|급식비|\(자\)|\(소\)|세금/.test(m))return 'tax';return 'etc'}

function assets(sid){const cash=bal(sid),pr=S.props.filter(x=>x.owner===sid).reduce((a,x)=>a+priceOf(x),0),stv=S.sh.filter(x=>x.owner===sid).reduce((a,x)=>a+(stk(x.stock)?.price||0),0),dep=S.deps.filter(d=>d.sid===sid&&d.status==='active').reduce((a,d)=>a+d.amt,0);return {cash,pr,stv,dep,total:cash+pr+stv+dep}}
function snapAll(s){const d=today();s.students.forEach(x=>{const a=s.snap[x.id]||(s.snap[x.id]=[]),t=assets(x.id).total;if(a.length&&a[a.length-1][0]===d)a[a.length-1][1]=t;else a.push([d,t]);if(a.length>90)a.shift()})}
function chg(sid,days){const a=S.snap[sid]||[],cur=assets(sid).total,lim=new Date(Date.now()-days*864e5).toISOString().slice(0,10);let base=null;a.forEach(([d,t])=>{if(d<=lim)base=[d,t]});const ex=!!base;if(!base&&a.length&&a[0][0]<today())base=a[0];return base?{v:cur-base[1],d:base[0],exact:ex}:null}

 return `<div class="card"><b>💰 나의 자산 현황</b><div class="tw"><table><tr><th>입출금 통장</th><th>예금</th><th>부동산</th><th>주식</th><th>총 자산</th></tr><tr><td class="n">${W(a.cash)}</td><td class="n">${W(a.dep)}</td><td class="n">${W(a.pr)}</td><td class="n">${W(a.stv)}</td><td class="n"><b>${W(a.total)}</b></td></tr></table></div><div>지난 2주 대비 ${f(chg(sid,14))}</div><div>한 달 대비 ${f(chg(sid,30))}</div></div>`}

 const i=s.apps.findIndex(a=>a.sid===me&&a.job===jid&&a.round===2);if(i>=0){s.apps.splice(i,1);return}if(s.apps.filter(a=>a.sid===me&&a.round===2).length>=2){toast('2개까지만 고를 수 있어요');return}s.apps.push({sid:me,job:jid,bid:BASE,round:2})})}
function allocate(s,es){const cnt={},left={};es.forEach(e=>cnt[e.job]=(cnt[e.job]||0)+1);
 s.jobs.forEach(j=>left[j.id]=(j.contract||j.locked)?0:Math.max(0,j.slots-s.assign.filter(a=>a.job===j.id).length));
 const avail=Object.assign({},left),got=new Set(s.assign.map(a=>a.sid)),win={};
 es.map(e=>Object.assign({r:Math.random()},e)).sort((a,b)=>a.bid-b.bid||a.r-b.r).forEach(e=>{if(got.has(e.sid)||!(left[e.job]>0))return;left[e.job]--;got.add(e.sid);(win[e.job]=win[e.job]||[]).push(e)});
 Object.keys(win).forEach(jid=>{const comp=cnt[jid]>avail[jid],pay=comp?Math.max(...win[jid].map(e=>e.bid)):BASE;win[jid].forEach(e=>s.assign.push({sid:e.sid,job:jid,pay}))})}

 // 안전장치: 서버가 현재 데이터를 따로 보관한 뒤에만 교체해요. 내 컴퓨터에도 현재 데이터 백업 파일을 한 번 더 저장해 둬요.
 try{const cr=await fetch('/api/backup',{headers:{Authorization:'Bearer '+TOKEN},cache:'no-store'});if(cr.ok){const cd=cr.headers.get('Content-Disposition')||'',m=/filename="([^"]+)"/.exec(cd);dlFile((m?m[1]:'gugu-bank-backup.json').replace('backup','before-restore'),'application/json',await cr.text())}}catch(e){}

 else{const e=(r.j&&r.j.error)||'서버에 연결할 수 없어요.';rstMsg(false,`❌ 복원 실패: ${esc(e)}${/그대로예요/.test(e)?'':' 현재 데이터는 그대로예요.'}`)}}

   <div class="row">${g.status==='open'?`<button onclick="finishGig('${g.id}')">구인 완료</button>`:(!g.paid?`<button class="s" onclick="reopenGig('${g.id}')">다시 모집</button>`:'')}${g.status==='done'&&!g.paid&&g.picked.length?`<button class="g" onclick="payGigs('${g.id}')">💸 급여 송금</button>`:''}<button class="s" onclick="gigForm('${g.id}')">수정</button><button class="r" onclick="delGig('${g.id}')">삭제</button></div></div>`).join('')||(end?'<div class="card mut">종료된 아르바이트가 아직 없어요.</div>':'<div class="card mut">공고가 없어요. 「공고 올리기」를 눌러 주세요.</div>'))}

 <div class="row"><label>상품</label><select id="dp2" onchange="depPick(this.value)"><option value="10,4">🟧 상품 1 · 10% / 4주</option><option value="5,2">🟦 상품 2 · 5% / 2주</option><option value="x">✏️ 직접 설정</option></select>
 <label>이율(%)</label><input id="dr2" type="number" min="0" step="0.1" value="10" style="width:70px"><label>기간(주)</label><input id="dw2" type="number" min="1" value="4" style="width:70px"></div>

 <div class="row"><label style="white-space:nowrap"><input type="checkbox" id="dx2" checked> 통장에 출금 기록도 남기기 (가입일 기준)</label></div>
 <div class="row"><button onclick="addDepT(${fixed?`'${fixed}'`:'null'})">예금 등록</button></div>
 <div class="mut">등록하면 「진행중」 예금이 되고, 만기가 되면 「만기 지급」으로 원금+이자를 통장에 넣어요. 이미 통장에서 원금이 빠진 예금이라면 출금 기록 체크를 꺼 주세요.</div></div>`}
function depPick(v){if(v==='x')return;const [r,w]=v.split(',');$('#dr2').value=r;$('#dw2').value=w}

 toast(skip.length?`잔액이 부족해서 제외했어요: ${skip.join(', ')}`:'예금을 등록했어요')}

// ───── 경매 ─────
// 규칙: 학생이 원하는 입찰가를 적는다 → 마감하면 높은 입찰가부터 수량만큼 낙찰 → 낙찰자 모두 「낙찰자 중 가장 낮은 입찰가」를 통장에서 낸다.
//  (같은 금액이면 먼저 입찰한 학생 우선 · 잔액이 모자란 학생은 제외하고 다음 순위로 넘어가요)
function aucCalc(a){let pool=a.bids.filter(b=>b.bid>=(a.min||0)).slice().sort((x,y)=>y.bid-x.bid||((x.t||0)-(y.t||0)));const failed=[];

  if(!bad)return{winners:w.map(x=>({sid:x.sid,bid:x.bid})),price,failed};failed.push({sid:bad.sid,bid:bad.bid});pool=pool.filter(x=>x!==bad)}}

async function allOk(){if(!await ask('대기 중인 요청과 주식 거래, 만기 예금 지급을 전부 승인할까요?'))return;mut(s=>{s.deps.filter(d=>d.status==='active'&&matDate(d)<=today()).forEach(d=>matureApply(s,d.id));s.tx.filter(t=>t.status==='wait').forEach(t=>apply(s,'tx',t.id,1));s.deps.filter(d=>d.status==='wait').forEach(d=>apply(s,'dep',d.id,1));s.preq.filter(o=>o.status==='wait').sort((a,b)=>(b.bid||0)-(a.bid||0)).forEach(o=>apply(s,'prq',o.id,1,'',qd(o.id)));cands().forEach(({b,l})=>dealApply(s,b.id,l.id))})}

const ITEMS=[['2주급 지급','in'],['소득세','out'],['자릿세','out'],['수도요금','out'],['전기요금','out'],['건강보험료','out'],['급식비','out'],['기타(직접입력)','out']];
const CART=['자릿세','수도요금','전기요금','건강보험료','급식비'];
const ownersSet=()=>new Set(S.props.filter(p=>p.owner).map(p=>p.owner));
function cartSet(i,k,v){view.cart=view.cart||{};view.cart[i]=Object.assign(view.cart[i]||{},{[k]:v})}
function exSet(m){const ow=ownersSet();view.ex=m==='none'?[]:S.students.filter(x=>m==='prop'?ow.has(x.id):!ow.has(x.id)).map(x=>x.id);render()}
function exTog(id,on){const e=new Set(view.ex||[]);if(on)e.delete(id);else e.add(id);view.ex=[...e];render()}
function oneSet(k,v){view.one=Object.assign(view.one||{},{[k]:v})}
function oneTog(id,on){const e=new Set((view.one||{}).sel||[]);if(on)e.add(id);else e.delete(id);oneSet('sel',[...e]);render()}
function oneAll(m){oneSet('sel',m?S.students.map(x=>x.id):[]);render()}
// 학생이 통장에 쓸 수 있는 분류와 똑같은 목록 (+ 교사 전용 시스템 분류). 고르면 지급/징수 방향·항목 이름이 자동으로 채워져요.
const CGRP=[['입금',['adj','comm','wel','dev','merit']],['출금',['fine','miss','right','exJ','exB','exT','snack']],['기타',['taxuse','etc']],['시스템 분류 (자동)',['pay','gig','auction','stock','estate','dep','tax','exempt']]];
const catOpts=v=>`<option value="">분류 자동</option>${CGRP.map(([g,ks])=>`<optgroup label="${g}">${ks.filter(k=>CATS[k]).map(k=>`<option value="${k}" ${v===k?'selected':''}>${CATS[k][1]}</option>`).join('')}</optgroup>`).join('')}`;
const catDir=k=>['adj','comm','wel','dev','merit','pay','gig'].includes(k)?'in':'out';
const catName=k=>EXV[k]?EXV[k].memo:k==='adj'?'잔액 조정':k==='miss'?'오늘하루 미달성':(CATS[k]?CATS[k][1].replace(/^\S+\s/,''):'');
function oneCat(k){const o=view.one=view.one||{};o.cat=k;if(k){o.dir=catDir(k);if(!(o.name||'').trim()||o.auto)o.name=catName(k),o.auto=1;if(EXV[k])o.amt=exAmt(k)}render()}
function cartCat(i,k){cartSet(i,'cat',k);if(k){cartSet(i,'dir',catDir(k));const c=view.cart[i];if(!(c.name||'').trim()||c.auto){c.name=catName(k);c.auto=1}if(EXV[k])c.val=exAmt(k)}render()}
function payHTML(){view.cart=view.cart||{};const ex=new Set(view.ex||[]),ow=ownersSet(),o=view.one||{};
 const chk=i=>`<input type="checkbox" ${(view.cart[i]||{}).on?'checked':''} onchange="cartSet(${i},'on',this.checked)">`;
 const val=i=>`<input type="number" min="0" value="${(view.cart[i]||{}).val??''}" oninput="cartSet(${i},'val',this.value)" style="width:100px" placeholder="구미">`;
 const rows=CART.map((c,i)=>`<tr><td>${chk(i)}</td><td style="text-align:left"><span class="tag tre">🟥 징수</span> ${c}</td><td>${val(i)}</td></tr>`).join('')
 +`<tr><td>${chk(50)}</td><td style="text-align:left"><span class="tag tgr">🟩 지급</span> 💼 직업 급여대로 (배정된 2주급 + <b>소득세 10% 자동 징수</b>, 활동 기간 자동 표기)</td><td class="mut">배정된 급여대로${S.job.paid?' ⚠ 이미 보낸 적 있어요':''}</td></tr>`
 +[100,101].map(i=>{const c=view.cart[i]||{};return `<tr><td>${chk(i)}</td><td style="text-align:left"><input placeholder="직접 입력 항목" value="${esc(c.name||'')}" oninput="cartSet(${i},'name',this.value);view.cart[${i}].auto=0" size="14"> <select onchange="cartSet(${i},'dir',this.value)"><option value="out" ${(c.dir||'out')==='out'?'selected':''}>징수</option><option value="in" ${c.dir==='in'?'selected':''}>지급</option></select> <select onchange="cartCat(${i},this.value)">${catOpts(c.cat)}</select></td><td>${val(i)}</td></tr>`}).join('');
 const sel=new Set(o.sel||[]);
 return `<div class="card"><h2>🛒 지급 / 징수 장바구니 (전체 학생 대상)</h2><div class="mut">체크한 항목을 한 번에 처리해요. 빼고 싶은 학생은 아래 「제외할 학생」에서 체크를 풀어요. 승인 없이 통장에 바로 반영돼요.</div>
 <div class="tw"><table><tr><th>선택</th><th>항목</th><th>금액 (구미)</th></tr>${rows}</table></div>
 <div class="row"><input type="date" value="${view.pd||today()}" onchange="view.pd=this.value"><button onclick="doCart()">🛒 체크한 항목 한 번에 실행</button></div></div>
 <div class="card"><b>👥 제외할 학생 (체크 해제하면 장바구니에서 빠져요)</b>
 <div class="row"><button class="s" onclick="exSet('none')">전체 포함</button><button class="s" onclick="exSet('prop')">부동산 소유자 제외</button><button class="s" onclick="exSet('noprop')">부동산 없는 학생 제외</button></div>
 <div class="row">${S.students.map(x=>`<label style="border:2px solid var(--line);border-radius:8px;padding:4px 8px;${ex.has(x.id)?'opacity:.5':''}"><input type="checkbox" ${ex.has(x.id)?'':'checked'} onchange="exTog('${x.id}',this.checked)"> ${esc(x.name)}${ow.has(x.id)?' 🏠':''}</label>`).join('')||'<span class="mut">학생이 없어요</span>'}</div><div class="mut">🏠 = 부동산 소유</div></div>
 <div class="card"><h2>🎯 일회성 지급 / 징수 (학생을 골라서)</h2>
 <div class="row"><select onchange="oneSet('dir',this.value)"><option value="out" ${(o.dir||'out')==='out'?'selected':''}>징수</option><option value="in" ${o.dir==='in'?'selected':''}>지급</option></select><input placeholder="항목 이름 (예: 벌금)" value="${esc(o.name||'')}" oninput="oneSet('name',this.value);view.one.auto=0" size="16"><input type="number" min="0" placeholder="금액" value="${o.amt??''}" oninput="oneSet('amt',this.value)" style="width:90px"><select onchange="oneCat(this.value)">${catOpts(o.cat)}</select></div>
 <div class="row"><button class="s" onclick="oneAll(true)">전체 선택</button><button class="s" onclick="oneAll(false)">선택 해제</button>${S.students.map(x=>`<label style="border:2px solid var(--line);border-radius:8px;padding:4px 8px;${sel.has(x.id)?'background:#fff3c4;color:#222':''}"><input type="checkbox" ${sel.has(x.id)?'checked':''} onchange="oneTog('${x.id}',this.checked)"> ${esc(x.name)}</label>`).join('')}</div>
 <div class="row"><button onclick="doOne()">🎯 선택한 학생에게 실행 (${sel.size}명)</button></div></div>`}
async function doOne(){const o=view.one||{},amt=Math.round(+o.amt),sel=(o.sel||[]).filter(id=>st(id)),dir=o.dir||'out';
 if(!(o.name||'').trim()||!(amt>0)||!sel.length)return toast('항목 이름, 금액, 학생을 확인해 주세요');
 if(!await ask(`${sel.map(id=>st(id).name).join(', ')} (${sel.length}명)에게 [${o.name.trim()} ${W(amt)}] ${dir==='in'?'지급':'징수'}할까요?`))return;
 mut(s=>sel.forEach(id=>addTx(id,o.name.trim(),dir,amt,'ok','teacher',view.pd||today(),o.cat||undefined)));view.one=null;render();toast('처리했어요')}
async function doCart(){const lines=[],ex=new Set(view.ex||[]);
 CART.forEach((c,i)=>{const v=view.cart?.[i]||{};if(!v.on||!(+v.val>0))return;lines.push({name:c,dir:'out',amt:Math.round(+v.val),cat:'tax'})});
 [100,101].forEach(i=>{const v=view.cart?.[i]||{};if(!v.on||!(v.name||'').trim()||!(+v.val>0))return;lines.push({name:v.name.trim(),dir:v.dir||'out',amt:Math.round(+v.val),cat:v.cat||''})});
 const job=!!(view.cart?.[50]||{}).on;if(!lines.length&&!job)return toast('체크한 항목과 금액을 확인해 주세요');if(job&&!fmtP())return toast('직업 활동 기간(일한 2주)을 먼저 입력해 주세요');
 const ids=S.students.filter(x=>!ex.has(x.id)).map(x=>x.id),d=view.pd||today();if(!ids.length)return toast('대상 학생이 없어요');
 const desc=lines.map(l=>`${l.name} ${W(l.amt)}`).concat(job?['직업 급여+소득세']:[]).join(', ');
 if(!await ask(`${ids.length}명에게 [${desc}] 를 한 번에 처리할까요?`))return;
 mut(s=>{lines.forEach(l=>ids.forEach(id=>addTx(id,l.name,l.dir,l.amt,'ok','teacher',d,l.cat||undefined)));if(job)salaryCore(s,ids,d)});view.cart={};render();toast('처리했어요')}
function manageStu(){
 return `<div class="card"><h2>학생 등록</h2><div class="row"><input id="ns" placeholder="이름 (여러 명은 쉼표로)" size="24"><button onclick="addSt()">추가</button></div>
 <div class="tw"><table><tr><th>이름</th><th>잔액</th><th>비밀번호</th><th></th></tr>${S.students.map(s=>`<tr><td>${esc(s.name)}</td><td class="n">${W(bal(s.id))}</td><td>${s.pin?'설정됨':'미설정'} <button class="s" onclick="rstPin('${s.id}')">초기화</button></td><td><button class="r" onclick="delSt('${s.id}')">삭제</button></td></tr>`).join('')}</table></div></div>
 <div class="card"><h2>교사 비밀번호</h2><div class="mut">교사 비밀번호는 Cloudflare 설정의 환경변수 <b>ADMIN_PASSWORD</b> 에서 바꿔요. (안전을 위해 화면에서는 바꾸지 않아요)</div></div>`}
function manageStk(){
 return `${discEditor()}<div class="card"><h2>주식 종목·시세</h2>${S.stocks.map(x=>`<div class="row">${esc(x.name)} <b>${esc(x.code)}</b> <input type="number" min="1" value="${x.price}" style="width:90px" onchange="setPrice('${x.id}',this.value)">구미 · 총 발행 <input type="number" min="0" value="${S.sh.filter(y=>y.stock===x.id).length}" style="width:60px" onchange="setLimit('${x.id}',this.value)">주 <input id="sf${x.id}" type="number" min="1" value="1" style="width:46px">주를 <input id="st${x.id}" type="number" min="2" value="2" style="width:46px">주로 <button class="s" onclick="splitStock('${x.id}')">액면분할</button> <button class="r" onclick="delStock('${x.id}')">삭제</button></div>`).join('')}
 <div class="row"><input id="sn" placeholder="새 종목 이름"><input id="sc" placeholder="티커 (예: FOOD)" style="width:110px"><input id="sp" type="number" placeholder="시작가" style="width:90px"><input id="sl" type="number" placeholder="총 발행(주)" style="width:90px"><button onclick="addStock()">종목 추가</button></div>
 <h2>📰 뉴스 등록</h2><div class="mut">가격 공시는 맨 위 「가격 공시」에서 회차별로 해요. 아래 가격 칸은 급하게 현재가만 고칠 때 써요.</div><div class="row"><select id="nm"><option value="10">10월</option><option value="11">11월</option><option value="12">12월</option></select><select id="nh"><option value="a">전반기</option><option value="b">후반기</option></select><select id="nk"><option value="trade">거래 주간 뉴스</option><option value="notice">거래 불가능 주간 후속 뉴스</option></select></div><div class="row"><select id="nsx"><option value="all">전체</option>${S.stocks.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><input id="nt" placeholder="뉴스 내용" size="30"><button onclick="addNews()">뉴스 등록</button></div><div class="mut">등록한 뉴스는 아래 「학생에게 보이는 화면」에서 확인하고 삭제할 수 있어요. 뒤에 나온 뉴스가 아래에 나와요.</div><h2>발행 주식 매도 등록</h2><div class="mut">아직 아무도 갖지 않은 주식(FOOD-001…)을 판매 주문으로 올려요. 번호 순서대로 올라가요.</div><div class="row"><select id="ps">${S.stocks.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><input id="pq" type="number" placeholder="판매 가격" style="width:110px"><input id="pn" type="number" placeholder="수량" style="width:70px"><button onclick="poolSell()">매도 등록</button><button class="r" onclick="delPoolOrders()">발행사 매도주문 모두 삭제</button></div></div>
 `}
function addSt(){const n=$('#ns').value.split(',').map(x=>x.trim()).filter(Boolean);if(n.length)mut(s=>n.forEach(x=>s.students.push({id:uid(),name:x,pin:''})))}
async function rstPin(id){if(await ask('비밀번호를 초기화할까요? 학생이 다시 만들게 돼요.'))mut(s=>st.call(0,id)&&(s.students.find(x=>x.id===id).pin=''))}
async function delSt(id){if(await ask('학생과 모든 기록을 삭제할까요?'))mut(s=>{s.students=s.students.filter(x=>x.id!==id);['tx','deps','orders','preq'].forEach(k=>s[k]=s[k].filter(x=>x.sid!==id));s.props.forEach(x=>{if(x.owner===id)x.owner=''});s.sh.forEach(x=>{if(x.owner===id)x.owner=''});s.ord.forEach(o=>{if(o.sid===id&&o.status==='open')o.status='cancel'});s.apps=s.apps.filter(a=>a.sid!==id);s.assign=s.assign.filter(a=>a.sid!==id)})}
function setPrice(id,v){mut(s=>{const x=s.stocks.find(y=>y.id===id),p=Math.max(1,Math.round(+v));if(p===x.price)return;x.price=p;x.hist.push({p,n:'직접 수정',d:today()})})}
async function delSplit(id){if(!await ask('이 액면분할 안내를 지울까요? (학생 통장 기록과 주식 수는 그대로예요)'))return;mut(s=>{s.splits=s.splits.filter(x=>x.id!==id)})}
function setLimit(id,v){const n=Math.max(0,Math.round(+v)||0);return mut(s=>{const x=s.stocks.find(y=>y.id===id);if(!x)return;
  const all=s.sh.filter(y=>y.stock===id),cur=all.length;
  if(n<cur){const num=tk=>+String(tk).split('-').pop()||0,pool=all.filter(y=>!y.owner).sort((a,b)=>num(b.tk)-num(a.tk)),cut=Math.min(cur-n,pool.length),rm=new Set(pool.slice(0,cut).map(y=>y.tk));
   s.sh=s.sh.filter(y=>!(y.stock===id&&rm.has(y.tk)));s.ord.forEach(o=>{if(o.status==='open'&&o.tk&&rm.has(o.tk))o.status='cancel'});
   x.limit=cur-cut;if(cut<cur-n)toast(`학생이 가진 주식이 있어서 ${x.limit}주까지만 줄일 수 있어요`)}
  else x.limit=n})}
async function delStock(id){if(await ask('종목을 삭제할까요? (보유·주문 기록은 남아요)'))mut(s=>{s.stocks=s.stocks.filter(x=>x.id!==id)})}
function addStock(){const n=$('#sn').value.trim(),p=+$('#sp').value;if(n&&p>0)mut(s=>s.stocks.push({id:uid(),name:n,code:($('#sc').value.trim().toUpperCase()||'STK'),price:Math.round(p),limit:Math.round(+$('#sl').value)||0}))}
init();
</script></body></html>
